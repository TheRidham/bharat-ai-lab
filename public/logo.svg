<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="petal" d="M60,60 C76,50 76,30 60,20 C44,30 44,50 60,60 Z"/>
    <line id="spoke" x1="60" y1="60" x2="60" y2="44" stroke="#FF9933" stroke-width="1.4" stroke-linecap="round"/>
    <mask id="holeMask">
      <rect x="0" y="0" width="120" height="120" fill="#FFFFFF"/>
      <circle cx="60" cy="60" r="17" fill="#000000"/>
    </mask>
  </defs>

  <g fill="#FF9933" mask="url(#holeMask)">
    <use href="#petal" transform="rotate(0 60 60)"/>
    <use href="#petal" transform="rotate(45 60 60)"/>
    <use href="#petal" transform="rotate(90 60 60)"/>
    <use href="#petal" transform="rotate(135 60 60)"/>
    <use href="#petal" transform="rotate(180 60 60)"/>
    <use href="#petal" transform="rotate(225 60 60)"/>
    <use href="#petal" transform="rotate(270 60 60)"/>
    <use href="#petal" transform="rotate(315 60 60)"/>
  </g>

  <circle cx="60" cy="60" r="17" fill="none" stroke="#FF9933" stroke-width="1.4"/>

  <g>
    <use href="#spoke" transform="rotate(0 60 60)"/>
    <use href="#spoke" transform="rotate(30 60 60)"/>
    <use href="#spoke" transform="rotate(60 60 60)"/>
    <use href="#spoke" transform="rotate(90 60 60)"/>
    <use href="#spoke" transform="rotate(120 60 60)"/>
    <use href="#spoke" transform="rotate(150 60 60)"/>
    <use href="#spoke" transform="rotate(180 60 60)"/>
    <use href="#spoke" transform="rotate(210 60 60)"/>
    <use href="#spoke" transform="rotate(240 60 60)"/>
    <use href="#spoke" transform="rotate(270 60 60)"/>
    <use href="#spoke" transform="rotate(300 60 60)"/>
    <use href="#spoke" transform="rotate(330 60 60)"/>
  </g>

  <circle cx="60" cy="60" r="3" fill="#FF9933"/>
</svg>
